<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KT 板云朵字生成器 · Cloud Letter Maker</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;background:#eef2f9;color:#2b3a55;overflow:hidden;display:flex;flex-direction:column;font-size:13px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:13px;color:inherit}
#topbar{height:56px;flex:0 0 56px;display:flex;align-items:center;gap:10px;padding:0 14px;background:#fff;border-bottom:1px solid #e3eaf5;box-shadow:0 1px 10px rgba(43,58,85,.06);z-index:20}
.brand{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;letter-spacing:.5px;margin-right:6px;white-space:nowrap}
.brand i{font-style:normal;font-size:19px}
.brand small{display:block;font-size:10px;color:#93a2bd;font-weight:400;letter-spacing:0}
.spacer{flex:1}
.btn{border:1px solid #dbe4f2;background:#fff;border-radius:10px;padding:7px 11px;cursor:pointer;color:#3a4a68;display:inline-flex;align-items:center;gap:5px;transition:.15s;white-space:nowrap;line-height:1.2}
.btn:hover{background:#f3f8ff;border-color:#b9d3f7;color:#2b6fd6}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.primary{background:linear-gradient(135deg,#7cc4f5,#6aa9ff);border:0;color:#fff;box-shadow:0 4px 14px rgba(106,169,255,.4);font-weight:600}
.btn.primary:hover{filter:brightness(1.05);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 8px;font-size:12px;border-radius:8px}
.btn.on{background:#eaf3ff;border-color:#a9cdfb;color:#2b6fd6}
main{flex:1;display:flex;min-height:0}
aside{background:#fff;display:flex;flex-direction:column;min-height:0}
#left{width:266px;flex:0 0 266px;border-right:1px solid #e3eaf5}
#right{width:302px;flex:0 0 302px;border-left:1px solid #e3eaf5}
.tabs{display:flex;gap:4px;padding:10px 10px 0;flex:0 0 auto}
.tabs button{flex:1;border:0;background:#f2f6fc;border-radius:9px 9px 0 0;padding:8px 0;cursor:pointer;color:#7d8aa3;font-size:12.5px}
.tabs button.on{background:#eaf3ff;color:#2b6fd6;font-weight:600}
.panel{display:none;flex:1;overflow:auto;padding:12px 12px 30px;min-height:0}
.panel.on{display:block}
.sec{font-size:11px;color:#93a2bd;letter-spacing:1px;margin:14px 0 8px;font-weight:600}
.sec:first-child{margin-top:2px}
.tpl-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tpl-card{border:2px solid #eef2f9;border-radius:12px;padding:5px;cursor:pointer;background:#fff;transition:.15s;text-align:center;position:relative;overflow:hidden}
.tpl-card:hover{border-color:#bcd8fb;transform:translateY(-1px);box-shadow:0 6px 16px rgba(43,58,85,.09)}
.tpl-card.on{border-color:#6aa9ff;box-shadow:0 0 0 3px rgba(106,169,255,.16)}
.tpl-card .thumb{height:64px;display:flex;align-items:center;justify-content:center;background:#fafcff;border-radius:8px;overflow:hidden}
.tpl-card .thumb svg{width:100%;height:100%;display:block}
.tpl-card .nm{font-size:11px;margin-top:4px;color:#5c6b87;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.layer{display:flex;align-items:center;gap:6px;padding:6px 7px;border-radius:9px;cursor:pointer;margin-bottom:4px;border:1px solid transparent}
.layer:hover{background:#f6f9ff}
.layer.on{background:#eaf3ff;border-color:#c8defb}
.layer .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.layer .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.layer .eye{opacity:.5;cursor:pointer;font-size:11px}
.layer .eye:hover{opacity:1}
.row{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.row>label{flex:0 0 76px;color:#6b7a96;font-size:12px}
.row>label.w{flex:0 0 60px}
.row .ctl{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
.row .val{flex:0 0 44px;text-align:right;color:#8b98b0;font-size:11.5px;font-variant-numeric:tabular-nums}
select,input[type=text],textarea{width:100%;border:1px solid #dbe4f2;border-radius:8px;padding:6px 8px;background:#fff;outline:none}
select:focus,textarea:focus,input[type=text]:focus{border-color:#8fbdf8;box-shadow:0 0 0 3px rgba(106,169,255,.13)}
textarea{resize:vertical;min-height:52px;line-height:1.45}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:5px;background:#e4ecf8}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;margin-top:-5px;border-radius:50%;background:#fff;border:2px solid #6aa9ff;box-shadow:0 1px 4px rgba(43,58,85,.2)}
input[type=range]::-moz-range-track{height:5px;border-radius:5px;background:#e4ecf8}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:#fff;border:2px solid #6aa9ff}
input[type=color]{width:36px;height:27px;padding:0;border:1px solid #dbe4f2;border-radius:8px;background:#fff;cursor:pointer;flex:0 0 auto}
input[type=checkbox]{width:15px;height:15px;accent-color:#6aa9ff;cursor:pointer}
.seg{display:flex;background:#f2f6fc;border-radius:9px;padding:2px;flex:1}
.seg button{flex:1;border:0;background:transparent;border-radius:7px;padding:5px 0;cursor:pointer;color:#7d8aa3;font-size:12px}
.seg button.on{background:#fff;color:#2b6fd6;font-weight:600;box-shadow:0 1px 4px rgba(43,58,85,.1)}
.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.mini-grid.two{grid-template-columns:repeat(2,1fr)}
.mini-grid button{border:1px solid #e2e9f5;background:#fff;border-radius:8px;padding:6px 2px;cursor:pointer;font-size:11.5px;color:#5c6b87}
.mini-grid button:hover{background:#f3f8ff;border-color:#bcd8fb;color:#2b6fd6}
.swatches{display:flex;gap:5px;flex-wrap:wrap}
.swatches i{width:17px;height:17px;border-radius:50%;cursor:pointer;border:2px solid #fff;box-shadow:0 0 0 1px #dbe4f2}
.stops{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.stops input[type=color]{width:28px;height:24px;border-radius:6px}
hr{border:0;border-top:1px solid #eef2f9;margin:14px 0}
.hint{color:#93a2bd;font-size:12px;line-height:1.7;padding:20px 6px;text-align:center}
#stage{flex:1;display:flex;flex-direction:column;min-width:0;background:#eef2f9}
#stagebar{flex:0 0 42px;display:flex;align-items:center;gap:8px;padding:0 12px;background:rgba(255,255,255,.75);border-bottom:1px solid #e3eaf5;backdrop-filter:blur(6px)}
#wrap{flex:1;overflow:auto;padding:26px;display:flex;min-height:0}
#canvas{background:#fff;box-shadow:0 8px 30px rgba(43,58,85,.16);border-radius:2px;display:block;touch-action:none;flex:0 0 auto;margin:auto}
#canvas text{user-select:none}
.modal{position:fixed;inset:0;background:rgba(28,39,58,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal[hidden]{display:none}
.modal-box{background:#fff;border-radius:16px;width:min(880px,96vw);max-height:94vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 60px rgba(20,30,50,.35)}
.modal-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #eef2f9}
.modal-head .muted{color:#93a2bd;font-size:12px}
.modal-body{overflow:auto;padding:18px;background:#f1f4fa;display:flex;flex-direction:column;align-items:center;gap:16px}
.print-page{background:#fff;box-shadow:0 4px 18px rgba(43,58,85,.15)}
.print-page svg{display:block;width:100%;height:100%}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,14px);background:rgba(43,58,85,.94);color:#fff;padding:9px 16px;border-radius:10px;font-size:12.5px;opacity:0;pointer-events:none;transition:.25s;z-index:200}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media print{
  @page{margin:0}
  body{overflow:visible;display:block;background:#fff}
  #topbar,#stage,#left,#right,#toast{display:none!important}
  .modal{position:static;inset:auto;background:none;padding:0;display:block;overflow:visible}
  .modal-box{box-shadow:none;border-radius:0;width:auto;max-height:none;display:block;overflow:visible}
  .modal-head{display:none}
  .modal-body{padding:0;background:#fff;display:block;overflow:visible}
  .print-page{box-shadow:none;margin:0;break-after:page;page-break-after:always}
  .print-page:last-child{break-after:auto;page-break-after:auto}
}
</style>
</head>
<body>
<header id="topbar">
  <div class="brand"><i>☁️</i><span>云朵字工坊<small>KT Board Cloud Letter Maker</small></span></div>
  <button class="btn ghost" id="btnUndo" title="撤销 Ctrl+Z">↶ 撤销</button>
  <button class="btn ghost" id="btnRedo" title="重做 Ctrl+Shift+Z">↷ 重做</button>
  <div class="spacer"></div>
  <select id="selOrient" aria-label="纸张方向" style="width:auto;padding:6px 10px;border-radius:10px">
    <option value="portrait">A4 纵向 210×297</option>
    <option value="landscape" selected>A4 横向 297×210</option>
  </select>
  <button class="btn" id="btnPreview">🖨 打印预览</button>
  <button class="btn primary" id="btnExport">⬇ 导出 PDF</button>
</header>
<main>
  <aside id="left">
    <div class="tabs">
      <button data-tab="tpl" class="on">模板库</button>
      <button data-tab="layers">元素</button>
      <button data-tab="page">页面</button>
    </div>
    <div class="panel on" id="panel-tpl">
      <div class="sec">预设组合模板</div>
      <div class="tpl-grid" id="tplGrid"></div>
      <div class="sec">课堂常用短语</div>
      <div class="mini-grid two" id="phraseGrid"></div>
    </div>
    <div class="panel" id="panel-layers">
      <div class="sec">当前页元素</div>
      <div id="layerList"></div>
      <div class="sec">图层顺序</div>
      <div class="mini-grid">
        <button data-z="top">置顶</button>
        <button data-z="up">上移</button>
        <button data-z="down">下移</button>
        <button data-z="bottom">置底</button>
        <button data-z="dup">复制</button>
        <button data-z="del">删除</button>
      </div>
    </div>
    <div class="panel" id="panel-page">
      <div class="sec">页面</div>
      <div class="row"><label>方向</label><div class="ctl"><div class="seg" id="segOrient"><button data-v="portrait">纵向</button><button data-v="landscape" class="on">横向</button></div></div></div>
      <div class="row"><label>页边距</label><div class="ctl"><input type="range" id="rngMargin" aria-label="页边距" min="0" max="25" step="1"><span class="val" id="valMargin">10mm</span></div></div>
      <div class="row"><label>页数</label><div class="ctl"><button class="btn sm" id="btnPagePrev">◀</button><span id="pageLabel" style="flex:1;text-align:center">1 / 1</span><button class="btn sm" id="btnPageNext">▶</button></div></div>
      <div class="mini-grid two">
        <button id="btnAddPage">新增页</button>
        <button id="btnDelPage">删除页</button>
      </div>
      <div class="sec">画布</div>
      <div class="mini-grid two">
        <button id="btnFit">适应窗口</button>
        <button id="btnZoomReset">100%</button>
      </div>
      <div class="sec">工程文件</div>
      <div class="mini-grid two">
        <button id="btnExportJson">导出 JSON</button>
        <button id="btnImportJson">导入 JSON</button>
      </div>
      <input type="file" id="fileJson" accept=".json,application/json" hidden>
      <p class="hint" style="text-align:left;padding:8px 2px">JSON 可在别的电脑导入继续编辑。字体需对方已安装，缺失时自动回退。</p>
      <hr>
      <div class="sec">危险操作</div>
      <div class="mini-grid two">
        <button id="btnClearPage">清空本页</button>
        <button id="btnReset">恢复默认</button>
      </div>
      <p class="hint" style="text-align:left;padding:12px 2px">所有编辑会自动保存在本机浏览器中，刷新不会丢失。</p>
    </div>
  </aside>
  <section id="stage">
    <div id="stagebar">
      <button class="btn sm" id="btnAddText">＋ 添加文字</button>
      <button class="btn sm" id="btnAddRow">＋ 一行单词</button>
      <span style="width:8px"></span>
      <button class="btn sm" id="btnSnap" title="拖拽时吸附到网格">▦ 网格吸附</button>
      <button class="btn sm" id="btnGuides" title="显示可打印区域">▭ 边距线</button>
      <div class="spacer"></div>
      <span id="zoomLabel" style="color:#8b98b0;font-size:12px;min-width:42px;text-align:right">100%</span>
      <button class="btn sm" id="btnZoomOut">－</button>
      <button class="btn sm" id="btnZoomIn">＋</button>
    </div>
    <div id="wrap"><svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg></div>
  </section>
  <aside id="right">
    <div style="padding:12px 14px 8px;border-bottom:1px solid #eef2f9;display:flex;align-items:center;gap:8px">
      <b style="font-size:13px">属性</b>
      <span id="inspTitle" style="color:#93a2bd;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
      <div class="spacer"></div>
      <button class="btn sm ghost" id="btnResetStyle" title="重置当前元素样式">重置样式</button>
    </div>
    <div class="panel on" id="inspector" style="display:block"></div>
  </aside>
</main>
<div class="modal" id="modal" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <b>打印预览</b>
      <span class="muted">按实际尺寸 1:1 输出，打印时请选择 A4、边距「无」</span>
      <div class="spacer"></div>
      <button class="btn" id="btnCloseModal">关闭</button>
      <button class="btn primary" id="btnDoPrint">打印</button>
    </div>
    <div class="modal-body" id="printArea"></div>
  </div>
</div>
<div id="toast"></div>
<script>
'use strict';
/* =========================================================
   Cloud Letter Maker — 单文件离线版
   坐标单位：全部为 mm（A4 = 210×297），PDF 输出时换算为 pt
   ========================================================= */
const $ = s => document.querySelector(s);
const $$ = s => Array.prototype.slice.call(document.querySelectorAll(s));
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const MM2PT = 72 / 25.4;
const uid = () => 'e' + Math.random().toString(36).slice(2, 8);
const n2 = v => Math.round(v * 100) / 100;
const A4 = { w: 210, h: 297 };

/* ---------------- 字体 ---------------- */
const FONTS = {
  round: { name: '圆体 Rounded', stack: '"Arial Rounded MT Bold","Varela Round",Nunito,"Trebuchet MS","Segoe UI",sans-serif' },
  comic: { name: '漫画 Comic', stack: '"Comic Sans MS","Chalkboard SE","Comic Neue","Trebuchet MS",cursive' },
  black: { name: '超粗 Impact', stack: 'Impact,"Arial Black","Haettenschweiler","Anton",sans-serif' },
  sans: { name: '无衬线 Sans', stack: 'Helvetica,Arial,"Segoe UI",Roboto,sans-serif' },
  serif: { name: '衬线 Serif', stack: 'Georgia,"Times New Roman",Times,serif' },
  script: { name: '手写 Script', stack: '"Segoe Script","Bradley Hand","Brush Script MT","Comic Sans MS",cursive' },
  mono: { name: '等宽 Mono', stack: '"Courier New",Courier,monospace' }
};
const fontStack = st => (FONTS[st.font] || FONTS.round).stack;
const LINE_HEIGHT = 1.12;   /* 多行固定行距 */
const fontCSS = (st, px) => (st.weight || 900) + ' ' + px + 'px ' + fontStack(st);

/* =========================================================
   1. 位图 -> 矢量：Canvas 渲染 -> 距离场 -> Marching Squares
   ========================================================= */

/* 渲染文字掩膜。返回 ink(1=墨迹) 与每 mm 的像素数 */
function renderMask(st) {
  const cv = document.createElement('canvas');
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  const BASE = 100;
  const lines = String(st.text == null ? '' : st.text).length ? String(st.text).split('\n') : [' '];
  const lsEm = st.letterSpacing || 0;
  const hasLS = 'letterSpacing' in ctx;      /* shortcut: 旧浏览器不支持字间距，会忽略该参数 */
  const setLS = px => { if (hasLS) ctx.letterSpacing = (lsEm * px).toFixed(2) + 'px'; };

  ctx.font = fontCSS(st, BASE);
  setLS(BASE);
  const m0 = ctx.measureText('Hxg');
  const asc0 = m0.actualBoundingBoxAscent || BASE * 0.75;
  const desc0 = m0.actualBoundingBoxDescent || BASE * 0.24;
  const widths = lines.map(l => (l.trim() === '' ? BASE * 0.4 : ctx.measureText(l).width));
  const lineH0 = BASE * LINE_HEIGHT;
  const blockH0 = asc0 + desc0 + (lines.length - 1) * lineH0;

  /* 目标字号：随 mm 字号放大，同时限制总像素量 */
  let targetFont = clamp((st.size || 30) * 12, 90, 640);
  let k = targetFont / BASE;
  const tw0 = Math.max.apply(null, widths) * k, th0 = blockH0 * k;
  const CAP = 1700;
  k *= Math.min(1, CAP / Math.max(tw0, 1), CAP / Math.max(th0, 1));
  let fontPx = BASE * k;
  let pxPerMm = fontPx / (st.size || 30);

  const outlineW = (st.outline || 'cloud') === 'none' ? 0 : Math.max(st.outerWidth || 0, st.innerWidth || 0);
  const ampMM = (st.outline || 'cloud') === 'none' ? 0 : (st.bumpAmp || 0) * (st.bumpSize || 0);
  let pad = Math.ceil((outlineW + ampMM * 1.4 + 2) * pxPerMm) + 8;
  let W = Math.ceil(Math.max.apply(null, widths) * k + pad * 2);
  let H = Math.ceil(blockH0 * k + pad * 2);
  const MAXPX = 9e6;
  if (W * H > MAXPX) {
    const s = Math.sqrt(MAXPX / (W * H));
    k *= s; fontPx = BASE * k; pxPerMm = fontPx / (st.size || 30);
    pad = Math.ceil((outlineW + ampMM * 1.4 + 2) * pxPerMm) + 8;
    W = Math.ceil(Math.max.apply(null, widths) * k + pad * 2);
    H = Math.ceil(blockH0 * k + pad * 2);
  }
  cv.width = W; cv.height = H;

  ctx.font = fontCSS(st, fontPx);
  setLS(fontPx);
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';
  ctx.fillStyle = '#000';
  const asc = asc0 * k, desc = desc0 * k, lineH = lineH0 * k;
  const blockH = asc + desc + (lines.length - 1) * lineH;
  const top = (H - blockH) / 2;
  const textW = Math.max.apply(null, widths) * k;
  lines.forEach((ln, i) => {
    /* 此处 ctx 已是 fontPx 字号，测量结果即为最终像素宽度 */
    const w = ln.trim() === '' ? BASE * 0.4 : ctx.measureText(ln).width;
    ctx.fillText(ln, pad + (textW - w) / 2, top + asc + i * lineH);
  });

  const data = ctx.getImageData(0, 0, W, H).data;
  const ink = new Uint8Array(W * H);
  for (let i = 0, j = 3; i < ink.length; i++, j += 4) ink[i] = data[j] > 110 ? 1 : 0;
  return { ink, W, H, pxPerMm, pad };
}

/* 欧氏距离变换（Felzenszwalb & Huttenlocher），返回平方距离 */
function edt(seed, w, h) {
  const n = Math.max(w, h) + 2;
  const f = new Float64Array(n), v = new Int32Array(n), z = new Float64Array(n + 1);
  const d = new Float32Array(w * h), INF = 1e10;
  for (let i = 0; i < w * h; i++) d[i] = seed[i] ? 0 : INF;
  for (let y = 0; y < h; y++) {
    const off = y * w;
    for (let x = 0; x < w; x++) f[x] = d[off + x];
    dt1d(f, w, d, off, 1, v, z);
  }
  for (let x = 0; x < w; x++) {
    for (let y = 0; y < h; y++) f[y] = d[x + y * w];
    dt1d(f, h, d, x, w, v, z);
  }
  return d;
}
function dt1d(f, n, out, off, stride, v, z) {
  let k = 0; v[0] = 0; z[0] = -1e20; z[1] = 1e20;
  for (let q = 1; q < n; q++) {
    let s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
    while (s <= z[k]) { k--; s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]); }
    k++; v[k] = q; z[k] = s; z[k + 1] = 1e20;
  }
  k = 0;
  for (let q = 0; q < n; q++) {
    while (z[k + 1] < q) k++;
    const dv = q - v[k];
    out[off + q * stride] = dv * dv + f[v[k]];
  }
}

/* 起伏函数：控制轮廓的云朵/波浪/气泡/不规则手感 */
function makeBump(st, pxPerMm) {
  const type = st.outline || 'cloud';
  const size = Math.max(2, st.bumpSize || 8);
  /* 起伏幅度不能超过文字到第一层边框的空隙，否则轮廓会啃到字 */

    s += '<circle data-handle="rotate" cx="0" cy="' + n2(-h - hs * 1.8) + '" r="' + n2(hs) + '" fill="#fff" stroke="#6aa9ff" stroke-width="' + n2(sw) + '" style="cursor:grab"/>';

const LSKEY = 'cloudletter.v1';
const hist = { undo: [], redo: [], key: '', t: 0 };
let saveTimer = 0;
const snapshot = () => JSON.stringify({ page: state.page, elements: state.elements, currentPage: state.currentPage });
function saveSoon() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(LSKEY, snapshot()); } catch (err) { /* 隐私模式忽略 */ }
  }, 400);
}
function commit(key) {
  const snap = snapshot(), now = Date.now();
  if (key && key === hist.key && now - hist.t < 900) hist.undo[hist.undo.length - 1] = snap;
  else { hist.undo.push(snap); if (hist.undo.length > 100) hist.undo.shift(); hist.key = key || ''; }
  hist.t = now; hist.redo.length = 0;
  saveSoon(); updateUndoBtns();
}
function updateUndoBtns() {
  $('#btnUndo').disabled = hist.undo.length < 2;
  $('#btnRedo').disabled = !hist.redo.length;
}
function restore(snap) {
  const d = JSON.parse(snap);
  state.page = d.page; state.elements = d.elements; state.currentPage = d.currentPage;
  state.selected = state.selected.filter(id => state.elements.some(e => e.id === id));
  if (state.currentPage >= state.page.pages) state.currentPage = Math.max(0, state.page.pages - 1);
  renderAll(); renderPanels(); syncInspector(); saveSoon();
}
function undo() { if (hist.undo.length < 2) return; hist.redo.push(hist.undo.pop()); restore(hist.undo[hist.undo.length - 1]); }
function redo() { if (!hist.redo.length) return; const s = hist.redo.pop(); hist.undo.push(s); restore(s); }

function tplThumbSvg(tpl) {
  const st = Object.assign({}, DEFAULT_STYLE, tpl.style, { text: tpl.text, size: Math.min(tpl.style.size || 30, 22) });
  let geo;
  try { geo = getGeo(st); } catch (e) { geo = null; }
  const pad = Math.max(geo ? geo.w : 30, geo ? geo.h : 20);
  const vb = (-pad * 0.62) + ' ' + (-pad * 0.48) + ' ' + (pad * 1.24) + ' ' + (pad * 0.96);
  if (!geo) return '<svg viewBox="0 0 100 60"></svg>';
  const gid = 'tg_' + tpl.id;
  const ax = gradAxis(st, geo.w, geo.h);
  const stops = gradStops(st);
  let s = '<svg viewBox="' + vb + '" preserveAspectRatio="xMidYMid meet">';
  s += '<defs><linearGradient id="' + gid + '" gradientUnits="userSpaceOnUse" x1="' + n2(ax.x1) + '" y1="' + n2(ax.y1) + '" x2="' + n2(ax.x2) + '" y2="' + n2(ax.y2) + '">' +
    stops.map((c, i) => '<stop offset="' + n2(i / (stops.length - 1 || 1)) + '" stop-color="' + c + '"/>').join('') + '</linearGradient></defs>';
  if (geo.outerD) s += '<path d="' + geo.outerD + '" fill="' + st.outerColor + '" fill-rule="evenodd"/>';
  if (geo.innerD) s += '<path d="' + geo.innerD + '" fill="' + st.innerColor + '" fill-rule="evenodd"/>';
  s += '<path d="' + geo.textD + '" fill="' + (st.fillMode === 'grad' ? 'url(#' + gid + ')' : st.fill) + '" fill-rule="evenodd"/>';
  geo.deco.forEach(p => { s += '<path d="' + polyD(p) + '" fill="' + st.decoColor + '"/>'; });

}

function fitWidth(el) {
  const g = getGeo(el.style);
  const maxW = pageDims().w - 2 * (state.page.margin || 0);
  if (g.w > 0 && g.w * (el.scale || 1) > maxW) el.scale = n2(maxW / g.w);

function applyTemplate(id, single) {
  const tpl = TEMPLATES.find(t => t.id === id);
  if (!tpl) return;
  state.tpl = id;
  const sel = selectedEls();
  if (single && sel.length === 1) {
    sel[0].style = Object.assign({}, sel[0].style, tpl.style);
    fitWidth(sel[0]);
  } else if (sel.length > 1) {
    sel.forEach(e => { e.style = Object.assign({}, e.style, tpl.style); fitWidth(e); });
  } else {
    const { w: W, h: H } = pageDims();
    const el = makeElement(Object.assign({ text: tpl.text }, tpl.style), W / 2, H * 0.36);
    const geo = getGeo(el.style);
    const sc = Math.min(1, (W - 2 * state.page.margin - 10) / geo.w);
    el.scale = n2(sc);
    if (id === 'wordcards') {
      const words = ('apple, banana, orange, grape, peach, lemon').split(/[,，\n]/).map(x => x.trim()).filter(Boolean).slice(0, 12);
      const cols = W > H ? 4 : 3;
      words.forEach((wd, i) => {
        const c = i % cols, r = Math.floor(i / cols);
        const e2 = makeElement(Object.assign({ text: wd }, tpl.style), 0, 0);
        e2.scale = n2(Math.min(1, (W - 2 * state.page.margin) / cols / (getGeo(e2.style).w + 8)));

  el.scale = n2(Math.min(1, (W - 2 * state.page.margin - 8) / geo.w));

   10.5 工程文件 JSON 导入 / 导出
   ========================================================= */
const HEXRE = /^#[0-9a-f]{6}$/i;
const num = (v, d, lo, hi) => (typeof v === 'number' && isFinite(v)) ? clamp(v, lo, hi) : d;
const pick = (v, list, d) => list.indexOf(v) >= 0 ? v : d;
/* 导入文件来自外部，按信任边界处理：逐字段校验并回落到安全默认值 */
function sanitizeElement(e, pages) {
  if (!e || typeof e !== 'object') return null;
  const st = Object.assign({}, DEFAULT_STYLE, e.style && typeof e.style === 'object' ? e.style : {});
  st.text = typeof st.text === 'string' ? st.text.slice(0, 300) : 'Word';
  st.font = pick(st.font, Object.keys(FONTS), 'round');
  st.outline = pick(st.outline, ['cloud', 'bubble', 'rounded', 'wave', 'irregular', 'none'], 'cloud');
  st.fillMode = pick(st.fillMode, ['solid', 'grad'], 'solid');
  st.deco = pick(st.deco, ['none', 'dots', 'stars', 'hearts', 'confetti', 'flowers'], 'none');
  ['fill', 'outerColor', 'innerColor', 'decoColor', 'shadowColor'].forEach(k => { if (!HEXRE.test(st[k])) st[k] = DEFAULT_STYLE[k]; });
  st.grad = (Array.isArray(st.grad) ? st.grad.filter(c => HEXRE.test(c)) : []).slice(0, 6);
  if (st.grad.length < 2) st.grad = DEFAULT_STYLE.grad.slice();
  st.weight = pick(+st.weight, [400, 600, 700, 900], 900);
  st.size = num(st.size, 30, 4, 200);
  st.letterSpacing = num(st.letterSpacing, 0.02, -0.2, 0.8);
  st.outerWidth = num(st.outerWidth, 9, 0, 30);
  st.innerWidth = num(st.innerWidth, 3.5, 0, 30);
  st.bumpSize = num(st.bumpSize, 15, 2, 60);
  st.bumpAmp = num(st.bumpAmp, 0.2, 0, 1);
  st.opacity = num(st.opacity, 1, 0.05, 1);
  st.shadowX = num(st.shadowX, 1, -10, 10);
  st.shadowY = num(st.shadowY, 1.6, -10, 10);
  st.shadowAlpha = num(st.shadowAlpha, 0.18, 0, 1);
  st.gradAngle = num(st.gradAngle, 90, 0, 360);
  st.shadow = !!st.shadow;
  return {
    id: typeof e.id === 'string' && e.id ? e.id : uid(),
    x: num(e.x, 100, -2000, 2000), y: num(e.y, 100, -2000, 2000),
    scale: num(e.scale, 1, 0.05, 8),
    rotation: num(e.rotation, 0, -360, 360),
    page: Math.round(num(e.page, 0, 0, Math.max(0, pages - 1))),
    hidden: !!e.hidden,
    style: pruneStyle(st)
  };
}
function exportJSON() {
  const data = Object.assign({ app: 'cloud-letter', version: 1, savedAt: new Date().toISOString() }, JSON.parse(snapshot()));
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'cloud-letter-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  toast('已导出 JSON（' + state.elements.length + ' 个元素）');
}
function importJSON(file) {
  const rd = new FileReader();
  rd.onerror = () => toast('读取文件失败');
  rd.onload = () => {
    let d;
    try { d = JSON.parse(String(rd.result)); } catch (err) { return toast('导入失败：不是有效的 JSON 文件'); }
    if (!d || typeof d !== 'object' || !Array.isArray(d.elements) || !d.page || typeof d.page !== 'object')
      return toast('导入失败：缺少 page / elements 字段');
    const pages = Math.round(num(d.page.pages, 1, 1, 50));
    const els = d.elements.map(e => sanitizeElement(e, pages)).filter(Boolean);
    const seen = new Set();
    els.forEach(e => { while (seen.has(e.id)) e.id = uid(); seen.add(e.id); });
    state.page = {
      orient: pick(d.page.orient, ['portrait', 'landscape'], 'landscape'),
      margin: num(d.page.margin, 10, 0, 30),
      pages: Math.max(pages, 1 + els.reduce((m, e) => Math.max(m, e.page), -1))
    };
    state.elements = els;
    state.currentPage = Math.round(num(d.currentPage, 0, 0, state.page.pages - 1));
    state.selected = [];
    commit('import');
    renderAll(); renderPanels(); syncInspector(); fitZoom();
    toast('已导入 ' + els.length + ' 个元素');
  };
  rd.readAsText(file);
}

/* =========================================================
   11. 事件绑定 / 启动
   ========================================================= */
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('on'), 2400);
}
function updateTransforms() {
  selectedEls().forEach(el => {
    const tf = elTransform(el);
    const g = canvas.querySelector('[data-id="' + el.id + '"]');
    if (g) g.setAttribute('transform', tf);
    const s = canvas.querySelector('[data-sel="' + el.id + '"]');
    if (s) s.setAttribute('transform', tf);
  });
}

/* 左侧 tabs */
$$('#left .tabs button').forEach(b => {
  b.onclick = () => {
    $$('#left .tabs button').forEach(x => x.classList.toggle('on', x === b));
    $$('#left .panel').forEach(p => p.classList.toggle('on', p.id === 'panel-' + b.dataset.tab));
  };
});
$('#tplGrid').addEventListener('click', e => {
  const c = e.target.closest('[data-tpl]');
  if (!c) return;
  applyTemplate(c.dataset.tpl, state.selected.length === 1);
});
$('#phraseGrid').addEventListener('click', e => {
  const b = e.target.closest('[data-phrase]');
  if (!b) return;
  const sel = selectedEls();
  if (sel.length) {
    sel.forEach(el => { el.style.text = b.dataset.phrase; fitWidth(el); });
    commit('phrase'); renderAll(); renderPanels(); syncInspector();
  } else phraseToNew(b.dataset.phrase);
});
$('#layerList').addEventListener('click', e => {
  const eye = e.target.closest('[data-eye]');
  if (eye) {
    const el = state.elements.find(x => x.id === eye.dataset.eye);
    if (el) { el.hidden = !el.hidden; commit('hide'); renderAll(); renderPanels(); }
    return;
  }
  const it = e.target.closest('[data-el]');
  if (it) select(it.dataset.el, e.shiftKey);
});
$$('#panel-layers [data-z]').forEach(b => {
  b.onclick = () => {
    const z = b.dataset.z;
    if (z === 'dup') duplicateSel();
    else if (z === 'del') deleteSel();
    else layerOrder(z);
  };
});
$('#selOrient').onchange = e => setOrient(e.target.value);
$('#rngMargin').oninput = e => {
  state.page.margin = +e.target.value;
  $('#valMargin').textContent = state.page.margin + 'mm';
  renderAll(); saveSoon();
};
$('#rngMargin').onchange = () => commit('margin');
$('#btnPagePrev').onclick = () => { if (state.currentPage > 0) { state.currentPage--; state.selected = []; renderAll(); renderPanels(); syncInspector(); } };
$('#btnPageNext').onclick = () => { if (state.currentPage < state.page.pages - 1) { state.currentPage++; state.selected = []; renderAll(); renderPanels(); syncInspector(); } };
$('#btnAddPage').onclick = () => {
  state.page.pages++; state.currentPage = state.page.pages - 1; state.selected = [];
  commit('addpage'); renderAll(); renderPanels(); syncInspector();
  toast('已新增第 ' + state.page.pages + ' 页');
};
$('#btnDelPage').onclick = () => {
  if (state.page.pages <= 1) return toast('至少保留 1 页');
  if (!confirm('删除第 ' + (state.currentPage + 1) + ' 页及其中的元素？')) return;
  state.elements = state.elements.filter(e => e.page !== state.currentPage);
  state.elements.forEach(e => { if (e.page > state.currentPage) e.page--; });
  state.page.pages--; state.currentPage = Math.min(state.currentPage, state.page.pages - 1);
  state.selected = [];
  commit('delpage'); renderAll(); renderPanels(); syncInspector();
};
$('#btnClearPage').onclick = () => {
  if (!curPageEls().length) return toast('本页已经是空的');
  if (!confirm('清空本页全部元素？此操作可以撤销。')) return;
  state.elements = state.elements.filter(e => e.page !== state.currentPage);
  state.selected = [];
  commit('clear'); renderAll(); renderPanels(); syncInspector();
  toast('已清空本页');
};
$('#btnReset').onclick = () => {
  if (!confirm('恢复默认模板？当前所有内容将被替换（可撤销）。')) return;
  seedDemo(true);
  commit('reset'); renderAll(); renderPanels(); syncInspector();
  toast('已恢复默认');
};
$('#btnFit').onclick = fitZoom;
$('#btnZoomReset').onclick = () => setZoom(1);
$('#btnZoomIn').onclick = () => setZoom(state.zoom + 0.1);
$('#btnZoomOut').onclick = () => setZoom(state.zoom - 0.1);
$('#btnSnap').onclick = () => { state.snap = !state.snap; renderAll(); renderPanels(); };
$('#btnGuides').onclick = () => { state.guides = !state.guides; renderAll(); renderPanels(); };
$('#btnUndo').onclick = undo;
$('#btnRedo').onclick = redo;
$('#btnExport').onclick = exportPDF;
$('#btnPreview').onclick = openPreview;
$('#btnCloseModal').onclick = () => { $('#modal').hidden = true; };
$('#btnDoPrint').onclick = () => {
  let st = document.getElementById('pageRule');
  if (!st) { st = document.createElement('style'); st.id = 'pageRule'; document.head.appendChild(st); }
  st.textContent = '@page{size:A4 ' + (state.page.orient === 'portrait' ? 'portrait' : 'landscape') + ';margin:0}';
  window.print();
};
$('#btnExportJson').onclick = exportJSON;
$('#btnImportJson').onclick = () => $('#fileJson').click();
$('#fileJson').onchange = e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!f) return;
  if (state.elements.length && !confirm('导入会替换当前全部内容（可撤销），继续？')) return;
  importJSON(f);
};
$('#btnAddText').onclick = () => addTextAt(null);
$('#btnAddRow').onclick = addWordRow;
$('#btnResetStyle').onclick = () => {
  const sel = selectedEls();
  if (!sel.length) return;
  const tpl = TEMPLATES.find(t => t.id === state.tpl) || TEMPLATES[0];
  sel.forEach(el => { el.style = Object.assign({}, DEFAULT_STYLE, tpl.style, { text: el.style.text }); });
  commit('resetstyle'); renderAll(); syncInspector();
  toast('已重置为模板「' + tpl.name + '」的样式');
};
function addWordRow() {
  const tpl = TEMPLATES.find(t => t.id === 'wordcards') || TEMPLATES[0];
  const words = ['apple', 'banana', 'orange', 'grape'];
  const { w: W, h: H } = pageDims();
  const n = words.length, cellW = (W - 2 * state.page.margin) / n;
  const made = words.map((wd, i) => {
    const el = makeElement(Object.assign({ text: wd }, tpl.style), state.page.margin + cellW * (i + 0.5), H * 0.5);
    const g = getGeo(el.style);
    el.scale = n2(Math.min(1, (cellW - 16) / g.w));
    return el;
  });
  state.elements.push.apply(state.elements, made);
  state.selected = made.map(m => m.id);
  commit('wordrow'); renderAll(); renderPanels(); syncInspector();
  toast('已添加 4 个单词卡，可继续修改文字');
}

/* 快捷键 */
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  const inField = tag === 'input' || tag === 'textarea' || tag === 'select';
  const meta = e.ctrlKey || e.metaKey;
  if (meta && e.key.toLowerCase() === 'z') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
  if (meta && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
  if (inField) return;
  if (meta && e.key.toLowerCase() === 'd') { e.preventDefault(); duplicateSel(); return; }
  if (meta && e.key.toLowerCase() === 'a') { e.preventDefault(); state.selected = curPageEls().map(x => x.id); renderAll(); renderPanels(); syncInspector(); return; }
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteSel(); return; }
  if (e.key === 'Escape') { $('#modal').hidden = true; select(null); return; }
  if (e.key.indexOf('Arrow') === 0) {
    const sel = selectedEls();
    if (!sel.length) return;
    e.preventDefault();
    const step = e.shiftKey ? 5 : 1;
    const dx = e.key === 'ArrowLeft' ? -step : e.key === 'ArrowRight' ? step : 0;
    const dy = e.key === 'ArrowUp' ? -step : e.key === 'ArrowDown' ? step : 0;
    sel.forEach(el => { el.x = n2(el.x + dx); el.y = n2(el.y + dy); });
    updateTransforms(); commit('nudge'); syncInspector();
  }
});

/* =========================================================
   12. 启动
   ========================================================= */
function seedDemo(force) {
  state.elements = [];
  state.page.pages = 1;
  state.currentPage = 0;
  const { w: W, h: H } = pageDims();
  const tpl = TEMPLATES[0];
  const el = makeElement(Object.assign({ text: 'Hello' }, tpl.style), W / 2, H * 0.34);
  const g = getGeo(el.style);
  el.scale = n2(Math.min(1, (W - 2 * state.page.margin - 12) / g.w));
  state.elements.push(el);
  const el2 = makeElement(Object.assign({}, (TEMPLATES.find(t => t.id === 'classroom') || tpl).style, { text: 'Welcome!' }), W / 2, H * 0.62);
  const g2 = getGeo(el2.style);
  el2.scale = n2(Math.min(1, (W - 2 * state.page.margin - 12) / g2.w));
  state.elements.push(el2);
  state.selected = [];
}
function boot() {
  let loaded = false;
  try {
    const raw = localStorage.getItem(LSKEY);
    if (raw) {
      const d = JSON.parse(raw);
      if (d && d.elements && d.page) {
        state.page = Object.assign({ orient: 'landscape', margin: 10, pages: 1 }, d.page);
        state.elements = d.elements;
        state.elements.forEach(e => pruneStyle(e.style));
        state.currentPage = d.currentPage || 0;
        if (state.currentPage >= state.page.pages) state.currentPage = 0;
        loaded = true;
      }
    }
  } catch (err) { console.warn('读取本地数据失败', err); }
  if (!loaded) seedDemo();
  renderAll(); renderPanels(); syncInspector();
  setTimeout(renderTemplates, 30);   /* 缩略图较慢，先让画布出图 */
  hist.undo = [snapshot()];
  updateUndoBtns();
  fitZoom();
}
boot();
