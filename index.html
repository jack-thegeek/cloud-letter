*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;background:#eef2f9;color:#2b3a55;overflow:hidden;display:flex;flex-direction:column;font-size:13px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:13px;color:inherit}
#topbar{height:56px;flex:0 0 56px;display:flex;align-items:center;gap:8px;padding:0 14px;overflow-x:auto;background:#fff;border-bottom:1px solid #e3eaf5;box-shadow:0 1px 10px rgba(43,58,85,.06);z-index:20}
.brand{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;letter-spacing:.5px;margin-right:6px;white-space:nowrap}
.brand i{font-style:normal;font-size:19px}
.brand small{display:block;font-size:10px;color:#93a2bd;font-weight:400;letter-spacing:0}
.spacer{flex:1}
.btn{border:1px solid #dbe4f2;background:#fff;border-radius:10px;padding:7px 11px;cursor:pointer;color:#3a4a68;display:inline-flex;align-items:center;gap:5px;transition:.15s;white-space:nowrap;line-height:1.2}
.btn:hover{background:#f3f8ff;border-color:#b9d3f7;color:#2b6fd6}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.danger{color:#e5484d;border-color:transparent;background:transparent}
.btn.danger:hover{background:#fff1f1;border-color:#ffd2d2;color:#cf2f36}
.btn.danger:disabled:hover{background:transparent;border-color:transparent;color:#e5484d}
.btn.primary{background:linear-gradient(135deg,#7cc4f5,#6aa9ff);border:0;color:#fff;box-shadow:0 4px 14px rgba(106,169,255,.4);font-weight:600}
.btn.primary:hover{filter:brightness(1.05);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 8px;font-size:12px;border-radius:8px}
.btn.on{background:#eaf3ff;border-color:#a9cdfb;color:#2b6fd6}
main{flex:1;display:flex;min-height:0}
aside{background:#fff;display:flex;flex-direction:column;min-height:0}
#left{width:266px;flex:0 0 266px;border-right:1px solid #e3eaf5}
#right{width:302px;flex:0 0 302px;border-left:1px solid #e3eaf5}
.tabs{display:flex;gap:4px;padding:10px 10px 0;flex:0 0 auto}
.tabs button{flex:1;border:0;background:#f2f6fc;border-radius:9px 9px 0 0;padding:8px 0;cursor:pointer;color:#7d8aa3;font-size:12.5px}
.tabs button.on{background:#eaf3ff;color:#2b6fd6;font-weight:600}
.panel{display:none;flex:1;overflow:auto;padding:12px 12px 30px;min-height:0}
.panel.on{display:block}
.sec{font-size:11px;color:#93a2bd;letter-spacing:1px;margin:14px 0 8px;font-weight:600}
#inspector .sec{font-size:13.5px;color:#2b3a55;letter-spacing:.5px;margin:20px 0 10px;font-weight:700}
.sec:first-child{margin-top:2px}
.tpl-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tpl-card{border:2px solid #eef2f9;border-radius:12px;padding:5px;cursor:pointer;background:#fff;transition:.15s;text-align:center;position:relative;overflow:hidden}
.tpl-card:hover{border-color:#bcd8fb;transform:translateY(-1px);box-shadow:0 6px 16px rgba(43,58,85,.09)}
.tpl-card.on{border-color:#6aa9ff;box-shadow:0 0 0 3px rgba(106,169,255,.16)}
.tpl-card .thumb{height:64px;display:flex;align-items:center;justify-content:center;background:#fafcff;border-radius:8px;overflow:hidden}
.tpl-card .thumb svg{width:100%;height:100%;display:block}
.tpl-card .nm{font-size:11px;margin-top:4px;color:#5c6b87;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.layer{display:flex;align-items:center;gap:6px;padding:6px 7px;border-radius:9px;cursor:pointer;margin-bottom:4px;border:1px solid transparent}
.layer:hover{background:#f6f9ff}
.layer.on{background:#eaf3ff;border-color:#c8defb}
.layer .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.layer .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.layer .eye{opacity:.5;cursor:pointer;font-size:11px}
.layer .eye:hover{opacity:1}
.row{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.row>label{flex:0 0 76px;color:#6b7a96;font-size:12px}
.row>label.w{flex:0 0 60px}
.row .ctl{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
.row .val{flex:0 0 44px;text-align:right;color:#8b98b0;font-size:11.5px;font-variant-numeric:tabular-nums}
select,input[type=text],textarea{width:100%;border:1px solid #dbe4f2;border-radius:8px;padding:6px 8px;background:#fff;outline:none}
select:focus,textarea:focus,input[type=text]:focus{border-color:#8fbdf8;box-shadow:0 0 0 3px rgba(106,169,255,.13)}
textarea{resize:vertical;min-height:52px;line-height:1.45}
/* 数字步进器：− 输入框 +（替代拖动滑块） */
.stepper{display:flex;align-items:center;height:30px;border:1px solid #dbe4f2;border-radius:8px;background:#fff;overflow:hidden;flex:0 0 auto}
.stepper button{width:25px;height:100%;border:0;padding:0;background:#f4f8ff;color:#5b7095;font-size:15px;line-height:1;cursor:pointer;transition:.12s;user-select:none}
.stepper button:hover{background:#e7f1ff;color:#2b6fd6}
.stepper button:active{background:#d8e8ff}
.stepper input{width:56px;height:100%;border:0;padding:0;background:transparent;text-align:center;font-size:12.5px;color:#2b3a55;outline:none;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper:focus-within{border-color:#8fbdf8;box-shadow:0 0 0 3px rgba(106,169,255,.13)}
.stepper .unit{padding-right:6px;color:#93a2bd;font-size:11px;white-space:nowrap}
input[type=color]{width:36px;height:27px;padding:0;border:1px solid #dbe4f2;border-radius:8px;background:#fff;cursor:pointer;flex:0 0 auto}
/* 颜色选择器 */
.chip-wrap{position:relative;display:inline-flex;flex:0 0 auto}
.chip-wrap input[type=color]{pointer-events:none}
.chip-open{position:absolute;inset:0;border-radius:8px;cursor:pointer}
.cp{position:fixed;inset:0;z-index:500;display:block}
.cp[hidden]{display:none}
.cp-box{position:absolute;background:#fff;border-radius:14px;padding:14px;width:272px;box-shadow:0 18px 48px rgba(20,30,50,.28);border:1px solid #e6ecf5}
.cp-sv{position:relative;height:150px;border-radius:10px;overflow:hidden;cursor:crosshair;touch-action:none}
.cp-sv b{position:absolute;inset:0;display:block}
.cp-base{background:#f00}
.cp-white{background:linear-gradient(to right,#fff,rgba(255,255,255,0))}
.cp-black{background:linear-gradient(to top,#000,rgba(0,0,0,0))}
.cp-dot{position:absolute;width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35);transform:translate(-50%,-50%);pointer-events:none}
.cp-hue{position:relative;height:14px;border-radius:7px;margin-top:14px;cursor:pointer;touch-action:none;background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.cp-hdot{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.25),0 2px 6px rgba(0,0,0,.25);transform:translate(-50%,-50%);pointer-events:none}
.cp-row{display:flex;align-items:center;gap:8px;margin-top:14px}
.cp-prev{width:30px;height:30px;border-radius:9px;box-shadow:inset 0 0 0 1px rgba(43,58,85,.12);flex:0 0 auto}
.cp-hex{flex:1;border:1px solid #dbe4f2;border-radius:8px;padding:6px 9px;font-size:12.5px;text-transform:uppercase;outline:none}
.cp-hex:focus{border-color:#8fbdf8;box-shadow:0 0 0 3px rgba(106,169,255,.13)}
.cp-swatches{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.cp-swatches i{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid #fff;box-shadow:0 0 0 1px #dbe4f2}
.cp-actions{display:flex;justify-content:flex-end;margin-top:14px}
/* 自绘勾选框 */
.cbx{display:inline-flex;align-items:center;gap:8px;cursor:pointer;color:#6b7a96;user-select:none;font-size:12.5px}
.cbx input{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
.cbx i{width:18px;height:18px;border-radius:6px;border:2px solid #cfdcf0;background:#fff;display:inline-flex;align-items:center;justify-content:center;transition:.15s;flex:0 0 auto}
.cbx i::after{content:'';width:8px;height:4px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) scale(0);transition:.15s;margin-top:-2px}
.cbx:hover i{border-color:#9dc6fb}
.cbx input:checked + i{background:linear-gradient(135deg,#7cc4f5,#6aa9ff);border-color:#6aa9ff;box-shadow:0 2px 8px rgba(106,169,255,.35)}
.cbx input:checked + i::after{transform:rotate(-45deg) scale(1)}
.cbx input:focus-visible + i{box-shadow:0 0 0 3px rgba(106,169,255,.22)}
/* 自绘下拉框 */
.csel{position:relative;display:flex;align-items:center;gap:6px;width:100%;border:1px solid #dbe4f2;border-radius:8px;padding:6px 9px;background:#fff;cursor:pointer;outline:none;user-select:none;font-size:13px;line-height:1.25;transition:.15s}
.csel:hover{border-color:#b9d3f7}
.csel:focus{border-color:#8fbdf8;box-shadow:0 0 0 3px rgba(106,169,255,.13)}
.csel-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.csel-caret{color:#93a2bd;font-size:9px;line-height:1;transition:transform .15s}
.csel.open .csel-caret{transform:rotate(180deg)}
.csel.compact{width:auto;min-width:150px}
.csel-native{display:none!important}
#cselPop{position:fixed;z-index:400;background:#fff;border:1px solid #e3eaf5;border-radius:10px;box-shadow:0 12px 32px rgba(43,58,85,.18);padding:5px;max-height:300px;overflow:auto}
#cselPop[hidden]{display:none}
.csel-opt{padding:7px 10px;border-radius:7px;cursor:pointer;font-size:12.5px;white-space:nowrap;color:#3a4a68}
.csel-opt:hover{background:#f3f8ff}
.csel-opt.on{background:#eaf3ff;color:#2b6fd6;font-weight:600}
.seg{display:flex;background:#f2f6fc;border-radius:9px;padding:2px;flex:1}
.seg button{flex:1;border:0;background:transparent;border-radius:7px;padding:5px 0;cursor:pointer;color:#7d8aa3;font-size:12px}
.seg button.on{background:#fff;color:#2b6fd6;font-weight:600;box-shadow:0 1px 4px rgba(43,58,85,.1)}
.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.mini-grid.two{grid-template-columns:repeat(2,1fr)}
.mini-grid button{border:1px solid #e2e9f5;background:#fff;border-radius:8px;padding:6px 2px;cursor:pointer;font-size:11.5px;color:#5c6b87}
.mini-grid button:hover{background:#f3f8ff;border-color:#bcd8fb;color:#2b6fd6}
.swatches{display:flex;gap:5px;flex-wrap:wrap}
.swatches i{width:17px;height:17px;border-radius:50%;cursor:pointer;border:2px solid #fff;box-shadow:0 0 0 1px #dbe4f2}
hr{border:0;border-top:1px solid #eef2f9;margin:14px 0}
.hint{color:#93a2bd;font-size:12px;line-height:1.7;padding:20px 6px;text-align:center}
#stage{flex:1;display:flex;flex-direction:column;min-width:0;background:#eef2f9}
.tbgroup{display:flex;align-items:center;gap:4px}
.tbsep{width:1px;height:22px;background:#e6ecf5;margin:0 3px;flex:0 0 auto}
#zoomLabel{color:#8b98b0;font-size:12px;min-width:40px;text-align:center;font-variant-numeric:tabular-nums;cursor:pointer}
#zoomLabel:hover{color:#2b6fd6}
#wrap{flex:1;overflow:auto;padding:26px;display:flex;min-height:0}
#canvas{background:#fff;box-shadow:0 8px 30px rgba(43,58,85,.16);border-radius:2px;display:block;touch-action:none;flex:0 0 auto;margin:auto}
#canvas text{user-select:none}
#canvas g[data-id]{cursor:move}
#canvas [data-handle="scale"]{cursor:nwse-resize}
#canvas [data-handle="rotate"]{cursor:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'%3E%3Cpath fill='%232b3a55' d='M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z'/%3E%3C/svg%3E") 12 12, grab}
#canvas.dragging{cursor:move}
#canvas.dragging.scl{cursor:nwse-resize}
#canvas.dragging.rot{cursor:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'%3E%3Cpath fill='%232b3a55' d='M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z'/%3E%3C/svg%3E") 12 12, grab}
#canvas.dragging *{cursor:inherit!important}
</style>

<script>
'use strict';
/* =========================================================
   Cloud Letter Maker — 单文件离线版
   坐标单位：px（96dpi，1mm = 3.7795px），A4 = 793.7×1122.52px
   ========================================================= */
const $ = s => document.querySelector(s);
const $$ = s => Array.prototype.slice.call(document.querySelectorAll(s));
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const PXMM = 96 / 25.4;          /* 1mm = 3.7795px */
const PX2PT = 0.75;              /* 1px = 0.75pt（96dpi） */
const uid = () => 'e' + Math.random().toString(36).slice(2, 8);
const n2 = v => Math.round(v * 100) / 100;
const A4 = { w: 210 * PXMM, h: 297 * PXMM };

/* ---------------- 字体 ---------------- */
const FONTS = {
  round: { name: '圆体 Rounded', stack: '"Arial Rounded MT Bold","Varela Round",Nunito,"Trebuchet MS","Segoe UI",sans-serif' },
  hand: { name: '手写体 Hand', stack: "'CLHand',cursive" },
  sys: { name: '系统默认 System', stack: 'system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' }
};
const fontStack = st => (FONTS[st.font] || FONTS.round).stack;
const LINE_HEIGHT = 1.12;   /* 多行固定行距 */
const fontCSS = (st, px) => (st.weight || 900) + ' ' + px + 'px ' + fontStack(st);

/* =========================================================
   1. 位图 -> 矢量：Canvas 渲染 -> 距离场 -> Marching Squares
   ========================================================= */

/* 渲染文字掩膜。返回 ink(1=墨迹) 与栅格比例 scale */
function renderMask(st) {
  const cv = document.createElement('canvas');
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  const BASE = 100;
  const lines = String(st.text == null ? '' : st.text).length ? String(st.text).split('\n') : [' '];
  const lsEm = st.letterSpacing || 0;
  const hasLS = 'letterSpacing' in ctx;      /* shortcut: 旧浏览器不支持字间距，会忽略该参数 */
  const setLS = px => { if (hasLS) ctx.letterSpacing = (lsEm * px).toFixed(2) + 'px'; };

  ctx.font = fontCSS(st, BASE);
  setLS(BASE);
  const m0 = ctx.measureText('Hxg');
  const asc0 = m0.actualBoundingBoxAscent || BASE * 0.75;
  const desc0 = m0.actualBoundingBoxDescent || BASE * 0.24;
  const widths = lines.map(l => (l.trim() === '' ? BASE * 0.4 : ctx.measureText(l).width));
  const lineH0 = BASE * LINE_HEIGHT;
  const blockH0 = asc0 + desc0 + (lines.length - 1) * lineH0;

  /* 目标字号：按 3.2 倍超采样栅格化，同时限制总像素量 */
  let targetFont = clamp((st.size || 113) * 3.2, 90, 640);
  let k = targetFont / BASE;
  const tw0 = Math.max.apply(null, widths) * k, th0 = blockH0 * k;
  const CAP = 1700;
  k *= Math.min(1, CAP / Math.max(tw0, 1), CAP / Math.max(th0, 1));
  let fontPx = BASE * k;
  let scale = fontPx / (st.size || 113);   /* 栅格像素 / 用户像素 */

  const outlineW = (st.outline || 'cloud') === 'none' ? 0 : Math.max(st.outerWidth || 0, st.innerWidth || 0);
  const ampPx = (st.outline || 'cloud') === 'none' ? 0 : (st.bumpAmp || 0) * (st.bumpSize || 0);
  let pad = Math.ceil((outlineW + ampPx * 1.4 + 2) * scale) + 8;
  let W = Math.ceil(Math.max.apply(null, widths) * k + pad * 2);
  let H = Math.ceil(blockH0 * k + pad * 2);
  const MAXPX = 9e6;
  if (W * H > MAXPX) {
    const s = Math.sqrt(MAXPX / (W * H));
    k *= s; fontPx = BASE * k; scale = fontPx / (st.size || 113);
    pad = Math.ceil((outlineW + ampPx * 1.4 + 2) * scale) + 8;
    W = Math.ceil(Math.max.apply(null, widths) * k + pad * 2);
    H = Math.ceil(blockH0 * k + pad * 2);
  }
  cv.width = W; cv.height = H;

  ctx.font = fontCSS(st, fontPx);
  setLS(fontPx);
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';
  ctx.fillStyle = '#000';
  const asc = asc0 * k, desc = desc0 * k, lineH = lineH0 * k;
  const blockH = asc + desc + (lines.length - 1) * lineH;
  const top = (H - blockH) / 2;
  const textW = Math.max.apply(null, widths) * k;
  lines.forEach((ln, i) => {
    /* 此处 ctx 已是 fontPx 字号，测量结果即为最终像素宽度 */
    const w = ln.trim() === '' ? BASE * 0.4 : ctx.measureText(ln).width;
    ctx.fillText(ln, pad + (textW - w) / 2, top + asc + i * lineH);
  });

  const data = ctx.getImageData(0, 0, W, H).data;
  const ink = new Uint8Array(W * H);
  for (let i = 0, j = 3; i < ink.length; i++, j += 4) ink[i] = data[j] > 110 ? 1 : 0;
  return { ink, W, H, scale, pad };
}

/* 欧氏距离变换（Felzenszwalb & Huttenlocher），返回平方距离 */
function edt(seed, w, h) {
  const n = Math.max(w, h) + 2;
  const f = new Float64Array(n), v = new Int32Array(n), z = new Float64Array(n + 1);
  const d = new Float32Array(w * h), INF = 1e10;
  for (let i = 0; i < w * h; i++) d[i] = seed[i] ? 0 : INF;
  for (let y = 0; y < h; y++) {
    const off = y * w;
    for (let x = 0; x < w; x++) f[x] = d[off + x];
    dt1d(f, w, d, off, 1, v, z);
  }
  for (let x = 0; x < w; x++) {
    for (let y = 0; y < h; y++) f[y] = d[x + y * w];
    dt1d(f, h, d, x, w, v, z);
  }
  return d;
}
function dt1d(f, n, out, off, stride, v, z) {
  let k = 0; v[0] = 0; z[0] = -1e20; z[1] = 1e20;
  for (let q = 1; q < n; q++) {
    let s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
    while (s <= z[k]) { k--; s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]); }
    k++; v[k] = q; z[k] = s; z[k + 1] = 1e20;
  }
  k = 0;
  for (let q = 0; q < n; q++) {
    while (z[k + 1] < q) k++;
    const dv = q - v[k];
    out[off + q * stride] = dv * dv + f[v[k]];
  }
}

/* 起伏函数：控制轮廓的云朵/波浪/气泡/不规则手感 */
function makeBump(st, scale) {
  const type = st.outline || 'cloud';
  const size = Math.max(8, st.bumpSize || 57);      /* 起伏波长（用户 px） */
  /* 起伏幅度不能超过文字到第一层边框的空隙，否则轮廓会啃到字 */
  const gap = (st.innerWidth > 1 ? st.innerWidth : (st.outerWidth || 0)) * 0.8;
  const A = Math.min((st.bumpAmp || 0) * size, gap) * scale;
  const on = type !== 'rounded' && type !== 'none' && A > 0.01;
  const k = 2 * Math.PI / (size * scale);
  let f = () => 0;
  if (type === 'cloud') f = (x, y) => A * (0.58 * Math.sin(x * k * 0.62 + 0.9) + 0.42 * Math.sin(y * k * 0.85 + 2.3));
  else if (type === 'wave') f = (x, y) => A * (0.5 * Math.sin(x * k + 0.5) + 0.5 * Math.sin(y * k * 0.9 + 1.7));
  else if (type === 'irregular') f = (x, y) => A * (0.4 * Math.sin(x * k * 0.47 + 1.1) + 0.33 * Math.sin(y * k * 0.61 + 2.7) + 0.27 * Math.sin((x + y) * k * 0.33 + 0.4));
  else if (type === 'bubble') f = (x, y) => A * 0.22 * (Math.sin(x * k * 0.33 + 1.4) + Math.sin(y * k * 0.47 + 0.2));
  return { on, f, amp: A };
}

/* 构建有符号距离场：内部为负，外部为正，并叠加起伏 */
function buildField(st) {
  const m = renderMask(st);
  const { ink, W, H, scale } = m, N = W * H;
  const notInk = new Uint8Array(N);
  for (let i = 0; i < N; i++) notInk[i] = ink[i] ? 0 : 1;
  const dInk = edt(ink, W, H), dEmpty = edt(notInk, W, H);
  const fw = W + 2, fh = H + 2;
  const F = new Float32Array(fw * fh);
  const bump = makeBump(st, scale);
  const soft = Math.max(2, ((st.innerWidth > 1 ? st.innerWidth : 8) * scale) * 0.85);
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = y * W + x;
      const sd = ink[i] ? -Math.sqrt(dEmpty[i]) : Math.sqrt(dInk[i]);
      let v = sd;
      if (bump.on && sd > -0.5) {
        const t = sd <= 0 ? 0 : Math.min(1, sd / soft);
        v = sd - bump.f(x, y) * (t * t * (3 - 2 * t));
      }
      F[(y + 1) * fw + x + 1] = v;
    }
  }
  /* 边界复制填充：让等值线自然闭合，避免出现环绕整张画布的伪轮廓 */
  for (let x = 0; x < fw; x++) { F[x] = F[fw + x]; F[(fh - 1) * fw + x] = F[(fh - 2) * fw + x]; }
  for (let y = 0; y < fh; y++) { F[y * fw] = F[y * fw + 1]; F[y * fw + fw - 1] = F[y * fw + fw - 2]; }
  return { F, fw, fh, scale, W, H };
}

/* Marching Squares：提取等值线闭合环 */
function isoLoops(f, w, h, level) {
  const pts = [], map = new Map(), segs = [];
  for (let y = 0; y < h - 1; y++) {
    const row = y * w;
    for (let x = 0; x < w - 1; x++) {
      const i0 = row + x;
      const v0 = f[i0], v1 = f[i0 + 1], v2 = f[i0 + w + 1], v3 = f[i0 + w];
      const b0 = v0 > level, b1 = v1 > level, b2 = v2 > level, b3 = v3 > level;
      const idx = (b0 ? 1 : 0) | (b1 ? 2 : 0) | (b2 ? 4 : 0) | (b3 ? 8 : 0);
      if (idx === 0 || idx === 15) continue;
      const E = (key, ax, ay, av, bx, by, bv) => {
        let p = map.get(key);
        if (p === undefined) {
          const dv = bv - av, t = dv === 0 ? 0.5 : (level - av) / dv;
          pts.push([ax + (bx - ax) * t, ay + (by - ay) * t]);
          p = pts.length - 1; map.set(key, p);
        }
        return p;
      };
      const e0 = () => E(i0 * 2, x, y, v0, x + 1, y, v1);
      const e1 = () => E((i0 + 1) * 2 + 1, x + 1, y, v1, x + 1, y + 1, v2);
      const e2 = () => E((i0 + w) * 2, x, y + 1, v3, x + 1, y + 1, v2);
      const e3 = () => E(i0 * 2 + 1, x, y, v0, x, y + 1, v3);
      const add = (a, b) => segs.push(a, b);
      switch (idx) {
        case 1: add(e3(), e0()); break;
        case 2: add(e0(), e1()); break;
        case 3: add(e3(), e1()); break;
        case 4: add(e1(), e2()); break;
        case 5: if ((v0 + v1 + v2 + v3) / 4 > level) { add(e3(), e2()); add(e0(), e1()); } else { add(e3(), e0()); add(e1(), e2()); } break;
        case 6: add(e0(), e2()); break;
        case 7: add(e3(), e2()); break;
        case 8: add(e2(), e3()); break;
        case 9: add(e0(), e2()); break;
        case 10: if ((v0 + v1 + v2 + v3) / 4 > level) { add(e3(), e0()); add(e1(), e2()); } else { add(e3(), e2()); add(e0(), e1()); } break;
        case 11: add(e1(), e2()); break;
        case 12: add(e1(), e3()); break;
        case 13: add(e0(), e1()); break;
        case 14: add(e3(), e0()); break;
      }
    }
  }
  const nxt = new Map();

function bindInspector() {
  const box = $('#inspector');
  const txt = $('#txtInput');
  if (txt) {
    const flush = () => {
      clearTimeout(txt._t);
      selectedEls().forEach(fitWidth);
      renderAll();
      const sc = document.querySelector('#inspector .stepper[data-prop="scale"] input');
      const first = selectedEls()[0];
      if (sc && first) sc.value = first.scale;
    };
    txt.oninput = () => {
      const v = txt.value;
      selectedEls().forEach(e => { e.style.text = v; });
      renderPanels();
      clearTimeout(txt._t);
      txt._t = setTimeout(flush, 300);   /* 描边重算约 200ms，输入时防抖 */
      commit('text-' + (state.selected[0] || ''));
    };
    txt.onblur = flush;
  }
  let liveT = null;
  box.querySelectorAll('.stepper[data-key],.stepper[data-prop]').forEach(node => {
    const prop = node.dataset.prop, k = node.dataset.key, f = +node.dataset.factor || 1;
    bindStepper(node, disp => {
      const v = disp / f;

        updateTransforms();
        commit(prop);
      } else {

  box.querySelectorAll('.chip-open').forEach(el => {

      if (inp) cpOpen(inp);

      selectedEls().forEach(e => { e.style[inp.dataset.key] = inp.value; });

  });

/* =========================================================
   7. 编辑操作：选择 / 拖拽 / 缩放 / 旋转 / 对齐 / 分布
   ========================================================= */
function select(id, additive) {
  if (!id) state.selected = [];
  else if (additive) {
    const i = state.selected.indexOf(id);
    if (i >= 0) state.selected.splice(i, 1); else state.selected.push(id);
  } else state.selected = [id];
  renderAll(); renderPanels(); syncInspector();
}
/* 旋转后的轴对齐包围盒（对齐 / 分布 / 铺满都按这个算） */
function elBounds(el) {
  const geo = getGeo(el.style), sc = el.scale || 1;
  const a = (el.rotation || 0) * Math.PI / 180;
  const c = Math.abs(Math.cos(a)), s = Math.abs(Math.sin(a));
  const w = (geo.w * c + geo.h * s) * sc, h = (geo.w * s + geo.h * c) * sc;
  return { x: el.x - w / 2, y: el.y - h / 2, w: w, h: h };
}
function alignSel(mode) {
  const sel = selectedEls();
  if (sel.length < 2) return toast('请先多选（Shift+点击）至少 2 个元素');
  const bs = sel.map(elBounds);
  const minx = Math.min.apply(null, bs.map(b => b.x)), maxx = Math.max.apply(null, bs.map(b => b.x + b.w));
  const miny = Math.min.apply(null, bs.map(b => b.y)), maxy = Math.max.apply(null, bs.map(b => b.y + b.h));
  const cx = (minx + maxx) / 2, cy = (miny + maxy) / 2;
  sel.forEach((el, i) => {
    const b = bs[i];
    if (mode === 'left') el.x += minx - b.x;
    if (mode === 'right') el.x += maxx - (b.x + b.w);
    if (mode === 'hcenter') el.x += cx - (b.x + b.w / 2);
    if (mode === 'top') el.y += miny - b.y;
    if (mode === 'bottom') el.y += maxy - (b.y + b.h);
    if (mode === 'vcenter') el.y += cy - (b.y + b.h / 2);
  });
  commit(); renderAll(); syncInspector();
}
function distribute(dir) {
  const sel = selectedEls();
  if (sel.length < 3) return toast('等间距分布需要至少 3 个元素');
  const bs = sel.map(elBounds);
  const idx = sel.map((e, i) => i).sort((a, b) => dir === 'h' ? bs[a].x - bs[b].x : bs[a].y - bs[b].y);
  const first = bs[idx[0]], last = bs[idx[idx.length - 1]];
  const total = dir === 'h' ? (last.x + last.w) - first.x : (last.y + last.h) - first.y;
  const sum = bs.reduce((a, b) => a + (dir === 'h' ? b.w : b.h), 0);
  const gap = (total - sum) / (sel.length - 1);
  let cur = dir === 'h' ? first.x : first.y;
  idx.forEach(i => {
    if (dir === 'h') { sel[i].x = cur + bs[i].w / 2; cur += bs[i].w + gap; }
    else { sel[i].y = cur + bs[i].h / 2; cur += bs[i].h + gap; }
  });
  commit(); renderAll(); syncInspector();
  if (gap < 0) toast('元素总宽超过可用空间，已重叠排列');
}
function action(act) {
  const sel = selectedEls(), { w: W, h: H } = pageDims(), m = state.page.margin;
  if (act === 'centerPage') {
    sel.forEach(e => { e.x = W / 2; e.y = H / 2; });
  } else if (act === 'fitPage') {
    sel.forEach(e => {
      const g = getGeo(e.style);
      e.scale = n2(Math.min(6, (W - 2 * m) / g.w, (H - 2 * m) / g.h));
    });
  } else if (act === 'autoArr') {
    const all = curPageEls().filter(e => !e.hidden);
    if (!all.length) return;
    all.sort((a, b) => a.y - b.y);
    const areaW = W - 2 * m, cols = all.length <= 3 ? 1 : (W > H ? Math.ceil(Math.sqrt(all.length * 1.4)) : Math.ceil(Math.sqrt(all.length)));
    const rows = Math.ceil(all.length / cols);
    const cellW = areaW / cols, cellH = (H - 2 * m) / Math.max(rows, 1);
    all.forEach((e, i) => {
      const c = i % cols, r = Math.floor(i / cols);
      const g = getGeo(e.style);
      e.scale = n2(Math.min(6, (cellW - 30) / g.w, (cellH - 30) / g.h));
      e.x = m + cellW * (c + 0.5); e.y = m + cellH * (r + 0.5);
      e.rotation = 0;
    });
    state.selected = all.map(e => e.id);
    toast('已自动排列 ' + all.length + ' 个元素');
  } else if (act === 'dup') {
    duplicateSel();
    return;
  }
  commit(); renderAll(); renderPanels(); syncInspector();
}
/* 自适应缩放：把选中元素缩放到占满页面可用宽度 / 高度（不改位置） */
function fillPage(axis) {
  const sel = selectedEls();
  if (!sel.length) return toast('请先选中元素');
  const { w: W, h: H } = pageDims(), m = state.page.margin;
  const availW = W - 2 * m, availH = H - 2 * m;
  sel.forEach(el => {
    const b = elBounds(el);   /* 已含旋转与当前缩放 */
    const k = axis === 'h' ? availW / b.w : availH / b.h;
    el.scale = n2(clamp((el.scale || 1) * k, 0.05, 6));   /* 只改缩放，位置保持不变 */
  });
  commit('fill' + axis); renderAll(); renderPanels(); syncInspector();
  toast(axis === 'h' ? '已铺满页面宽度' : '已铺满页面高度');
}
function duplicateSel() {
  const sel = selectedEls();
  if (!sel.length) return;
  const copies = sel.map(e => {
    const c = JSON.parse(JSON.stringify(e));
    c.id = uid(); c.x = e.x + 6; c.y = e.y + 6;
    return c;
  });
  state.elements.push.apply(state.elements, copies);
  state.selected = copies.map(c => c.id);
  commit(); renderAll(); renderPanels(); syncInspector();
}
function deleteSel() {
  if (!state.selected.length) return;
  state.elements = state.elements.filter(e => !state.selected.includes(e.id));
  state.selected = [];
  commit(); renderAll(); renderPanels(); syncInspector();
}
function layerOrder(z) {
  const id = state.selected[0];
  if (!id) return;
  const els = state.elements;
  const pageIdx = [];
  els.forEach((e, i) => { if (e.page === state.currentPage) pageIdx.push(i); });
  const pos = pageIdx.findIndex(i => els[i].id === id);
  if (pos < 0) return;
  const target = z === 'top' ? pageIdx.length - 1 : z === 'bottom' ? 0 : z === 'up' ? pos + 1 : pos - 1;
  if (target < 0 || target >= pageIdx.length || target === pos) return;
  const a = pageIdx[pos], b = pageIdx[target];
  const tmp = els[a]; els[a] = els[b]; els[b] = tmp;

/* 拖拽 / 缩放 / 旋转 */
let drag = null;
canvas.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  const handle = e.target.getAttribute && e.target.getAttribute('data-handle');
  const p = toSVG(e);
  if (handle) {
    const sel = selectedEls();
    if (!sel.length) return;
    const el = sel[sel.length - 1];
    const b = elBounds(el);
    drag = { mode: handle, start: p, els: sel.map(x => ({ el: x, x: x.x, y: x.y, scale: x.scale, rotation: x.rotation })),
      box: { w: b.w, h: b.h }, pivot: { x: el.x, y: el.y } };
    canvas.classList.add('dragging');
    canvas.classList.toggle('rot', handle === 'rotate');
    canvas.classList.toggle('scl', handle === 'scale');
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    return;
  }
  const g = e.target.closest ? e.target.closest('g[data-id]') : null;
  if (!g) { select(null); drag = null; return; }
  const id = g.getAttribute('data-id');
  if (e.shiftKey) select(id, true);
  else if (!state.selected.includes(id)) select(id);
  const sel = selectedEls();
  drag = { mode: 'move', start: p, els: sel.map(x => ({ el: x, x: x.x, y: x.y })) };
  canvas.classList.add('dragging');
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
});
canvas.addEventListener('pointermove', e => {
  if (!drag) return;
  const p = toSVG(e);
  const dx = p.x - drag.start.x, dy = p.y - drag.start.y;
  if (drag.mode === 'move') {
    drag.els.forEach(o => {
      o.el.x = n2(o.x + dx); o.el.y = n2(o.y + dy);
    });
  } else if (drag.mode === 'scale') {
    const base = drag.els[0];
    const dist0 = Math.hypot(drag.start.x - drag.pivot.x, drag.start.y - drag.pivot.y) || 1;
    const dist1 = Math.hypot(p.x - drag.pivot.x, p.y - drag.pivot.y);
    const f = dist1 / dist0;
    drag.els.forEach(o => { o.el.scale = clamp(n2(o.scale * f), 0.05, 6); });
  } else if (drag.mode === 'rotate') {
    const base = drag.els[0];
    const a0 = Math.atan2(drag.start.y - drag.pivot.y, drag.start.x - drag.pivot.x);
    const a1 = Math.atan2(p.y - drag.pivot.y, p.x - drag.pivot.x);
    let deg = base.rotation + (a1 - a0) * 180 / Math.PI;
    deg = Math.round(deg);
    if (e.shiftKey) deg = Math.round(deg / 15) * 15;
    drag.els.forEach(o => { o.el.rotation = ((deg % 360) + 540) % 360 - 180; });
  }
  updateTransforms();
  if (drag.mode !== 'move' || drag.els.length === 1) {
    const vals = $('#inspector').querySelectorAll('input[data-prop]');
    vals.forEach(inp => {
      const el = drag.els[0].el, k = inp.dataset.prop;
      inp.value = el[k];
      const sp = inp.parentNode.querySelector('.val');
      if (sp) sp.textContent = k === 'scale' ? Math.round(el.scale * 100) + '%' : k === 'rotation' ? Math.round(el.rotation) + '°' : n2(el[k]);
    });
  }
});
function endDragCursor() {
  canvas.classList.remove('dragging', 'rot', 'scl');
}
canvas.addEventListener('pointercancel', () => { drag = null; endDragCursor(); renderAll(); });
canvas.addEventListener('pointerup', e => {
  endDragCursor();
  if (!drag) return;
  const moved = drag;
  drag = null;
  try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}
  const same = moved.mode === 'move' ? moved.els.every(o => o.el.x === o.x && o.el.y === o.y)
    : moved.els.every(o => o.el.scale === o.scale && o.el.rotation === o.rotation);
  if (!same) commit();
  renderAll(); renderPanels(); syncInspector();
});
canvas.addEventListener('dblclick', e => {

/* 滚轮缩放 */
$('#wrap').addEventListener('wheel', e => {

   8. 新增 / 页面设置

function addTextAt(p) {

function setOrient(v) {

function setZoom(z) {

function fitZoom() {

/* =========================================================
   9. PDF 导出（纯矢量，零依赖）
   ========================================================= */
const pn = v => { const r = Math.round(v * 1000) / 1000; return String(r === 0 ? 0 : r); };
const hexToRgbF = hex => {
  const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || '').trim());
  const h = m ? m[1] : '000000';
  return [0, 2, 4].map(i => Math.min(1, Math.max(0, parseInt(h.substr(i, 2), 16) / 255)));
};
/* 元素本地 px -> pt（元素自身的位移/旋转/缩放交给 cm 矩阵） */
const LPT = (x, y) => [x * PX2PT, y * PX2PT];
function pdfPath(pts, M) {
  const p0 = M(pts[0][0], pts[0][1]);
  let s = pn(p0[0]) + ' ' + pn(p0[1]) + ' m';
  for (let i = 1; i < pts.length; i++) {
    const p = M(pts[i][0], pts[i][1]);
    s += ' ' + pn(p[0]) + ' ' + pn(p[1]) + ' l';
  }
  return s + ' h';
}
function buildPDF() {
  const { w: PW, h: PH } = pageDims();
  const pages = [];
  /* 透明度要用 ExtGState 命名资源（PDF 的 gs 操作符只接受名字，不接受数值） */
  const gstates = new Map();
  const gsFor = a => {
    const k = Math.round(clamp(a, 0, 1) * 100) / 100;
    if (!gstates.has(k)) gstates.set(k, 'GA' + gstates.size);
    return gstates.get(k);
  };
  for (let p = 0; p < state.page.pages; p++) {
    const L = ['q 0 0 ' + pn(PW * PX2PT) + ' ' + pn(PH * PX2PT) + ' re W n'];
    state.elements.filter(e => e.page === p && !e.hidden).forEach(el => {
      const st = el.style, geo = getGeo(st), sc = el.scale || 1;
      const rad = (el.rotation || 0) * Math.PI / 180;
      const cos = Math.cos(rad), sin = Math.sin(rad);
      const a = cos * sc, b = -sin * sc, c = -sin * sc, d = -cos * sc;
      const e0 = el.x * PX2PT, f0 = (PH - el.y) * PX2PT;
      L.push('q');
      if (st.opacity != null && st.opacity < 1) L.push('/' + gsFor(st.opacity) + ' gs');
      L.push([a, b, c, d, e0, f0].map(pn).join(' ') + ' cm');
      const fill = (loops, hex) => {
        if (!loops || !loops.length) return;
        const rgb = hexToRgbF(hex);
        L.push(rgb.map(pn).join(' ') + ' rg');
        L.push(loops.map(x => pdfPath(x, LPT)).join(' ') + ' f*');
      };
      const base = geo.outerPts.length ? geo.outerPts : geo.textPts;
      if (st.shadow && base.length) {
        const rgb = hexToRgbF(st.shadowColor);
        const al = st.shadowAlpha == null ? 0.18 : st.shadowAlpha;
        const MS = (x, y) => LPT(x + (st.shadowX || 0), y + (st.shadowY || 0));
        L.push('q');
        L.push('/' + gsFor(al) + ' gs');
        L.push(rgb.map(pn).join(' ') + ' rg');
        L.push(base.map(x => pdfPath(x, MS)).join(' ') + ' f*');
        L.push('Q');
      }
      fill(geo.outerPts, st.outerColor);
      fill(geo.innerPts, st.innerColor);
      fill(geo.textPts, st.fill);
      if (geo.deco.length) {
        const rgb = hexToRgbF(st.decoColor);
        L.push(rgb.map(pn).join(' ') + ' rg');
        L.push(geo.deco.map(x => pdfPath(x, LPT)).join(' ') + ' f');
      }
      L.push('Q');
    });
    pages.push(L.join('\n') + '\nQ\n');
  }

  const objs = [];
  const add = x => { objs.push(x); return objs.length; };
  const catalogId = add(null), pagesId = add(null);
  const fontId = add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>');
  const gsList = Array.from(gstates.entries());
  const gsStart = objs.length + 1;
  gsList.forEach(([a]) => add('<< /Type /ExtGState /ca ' + a + ' /CA ' + a + ' >>'));
  const gsDict = gsList.length ? ' /ExtGState << ' + gsList.map(([a, n], i) => '/' + n + ' ' + (gsStart + i) + ' 0 R').join(' ') + ' >>' : '';
  const kids = [];
  pages.forEach(content => {
    const cId = add('<< /Length ' + content.length + ' >>\nstream\n' + content + 'endstream');
    kids.push(add('<< /Type /Page /Parent ' + pagesId + ' 0 R /MediaBox [0 0 ' + pn(PW * PX2PT) + ' ' + pn(PH * PX2PT) + ']' +
      ' /Resources << ' + gsDict + ' /Font << /F1 ' + fontId + ' 0 R >> >>' +
      ' /Contents ' + cId + ' 0 R >>'));
  });
  objs[catalogId - 1] = '<< /Type /Catalog /Pages ' + pagesId + ' 0 R >>';
  objs[pagesId - 1] = '<< /Type /Pages /Count ' + kids.length + ' /Kids [' + kids.map(i => i + ' 0 R').join(' ') + '] >>';

  let pdf = '%PDF-1.4\n';
  const offsets = [];
  objs.forEach((x, i) => {
    offsets.push(pdf.length);
    pdf += (i + 1) + ' 0 obj\n' + x + '\nendobj\n';
  });
  const xref = pdf.length;
  pdf += 'xref\n0 ' + (objs.length + 1) + '\n0000000000 65535 f \n';
  offsets.forEach(o => { pdf += String(o).padStart(10, '0') + ' 00000 n \n'; });
  pdf += 'trailer\n<< /Size ' + (objs.length + 1) + ' /Root ' + catalogId + ' 0 R >>\nstartxref\n' + xref + '\n%%EOF\n';
  const bytes = new Uint8Array(pdf.length);
  for (let i = 0; i < pdf.length; i++) bytes[i] = pdf.charCodeAt(i) & 255;
  return bytes;
}
/* 导出当前页为 PNG：直接把同一套矢量路径塞进独立 SVG 再栅格化，不依赖字体 */
function exportPNG(scale) {
  const { w: W, h: H } = pageDims(), k = scale || 3;
  let body = '<rect width="' + W + '" height="' + H + '" fill="#ffffff"/>';
  curPageEls().filter(e => !e.hidden).forEach(el => { body += elementMarkup(el, getGeo(el.style)); });
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">' + body + '</svg>';
  const url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml;charset=utf-8' }));
  const img = new Image();
  img.onload = () => {
    const cv = document.createElement('canvas');
    cv.width = Math.round(W * k); cv.height = Math.round(H * k);
    const ctx = cv.getContext('2d');
    ctx.drawImage(img, 0, 0, cv.width, cv.height);
    URL.revokeObjectURL(url);
    cv.toBlob(b => {
      if (!b) return toast('导出图片失败');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = 'cloud-letter-p' + (state.currentPage + 1) + '-' + new Date().toISOString().slice(0, 10) + '.png';
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
      toast('图片已生成：' + cv.width + '×' + cv.height + ' px · ' + Math.round(b.size / 1024) + ' KB');
    }, 'image/png');
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('导出图片失败'); };
  img.src = url;
}

function exportPDF() {

    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
    toast('PDF 已生成：A4 ' + (state.page.orient === 'portrait' ? '纵向' : '横向') + ' · ' + Math.round(bytes.length / 1024) + ' KB');
  } catch (err) {
    console.error(err);
    toast('导出失败：' + err.message);
  }
}

/* =========================================================
   10.5 工程文件 JSON 导入 / 导出
   ========================================================= */
const HEXRE = /^#[0-9a-f]{6}$/i;
const num = (v, d, lo, hi) => (typeof v === 'number' && isFinite(v)) ? clamp(v, lo, hi) : d;
const pick = (v, list, d) => list.indexOf(v) >= 0 ? v : d;
/* 导入文件来自外部，按信任边界处理：逐字段校验并回落到安全默认值 */
function sanitizeElement(e, pages) {
  if (!e || typeof e !== 'object') return null;
  const st = Object.assign({}, DEFAULT_STYLE, e.style && typeof e.style === 'object' ? e.style : {});
  st.text = typeof st.text === 'string' ? st.text.slice(0, 300) : 'Word';
  st.font = pick(st.font, Object.keys(FONTS), 'round');
  st.outline = pick(st.outline, ['cloud', 'bubble', 'rounded', 'wave', 'irregular', 'none'], 'cloud');
  st.deco = pick(st.deco, ['none', 'dots', 'stars', 'hearts', 'confetti', 'flowers'], 'none');
  ['fill', 'outerColor', 'innerColor', 'decoColor', 'shadowColor'].forEach(k => { if (!HEXRE.test(st[k])) st[k] = DEFAULT_STYLE[k]; });
  st.weight = pick(+st.weight, [400, 600, 700, 900], 900);
  st.size = num(st.size, 113, 20, 600);
  st.letterSpacing = num(st.letterSpacing, 0.02, -0.2, 0.8);
  st.outerWidth = num(st.outerWidth, 34, 0, 120);
  st.innerWidth = num(st.innerWidth, 13, 0, 120);
  st.bumpSize = num(st.bumpSize, 57, 8, 230);
  st.bumpAmp = num(st.bumpAmp, 0.2, 0, 1);
  st.opacity = num(st.opacity, 1, 0.05, 1);
  st.shadowX = num(st.shadowX, 4, -40, 40);
  st.shadowY = num(st.shadowY, 6, -40, 40);
  st.shadowAlpha = num(st.shadowAlpha, 0.18, 0, 1);
  st.shadow = !!st.shadow;
  return {
    id: typeof e.id === 'string' && e.id ? e.id : uid(),
    x: num(e.x, 100, -2000, 2000), y: num(e.y, 100, -2000, 2000),
    scale: num(e.scale, 1, 0.05, 8),
    rotation: num(e.rotation, 0, -360, 360),
    page: Math.round(num(e.page, 0, 0, Math.max(0, pages - 1))),
    hidden: !!e.hidden,
    style: pruneStyle(st)
  };
}
function exportJSON() {
  const data = Object.assign({ app: 'cloud-letter', version: 2, savedAt: new Date().toISOString() }, JSON.parse(snapshot()));
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'cloud-letter-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  toast('已导出 JSON（' + state.elements.length + ' 个元素）');
}
function importJSON(file) {
  const rd = new FileReader();
  rd.onerror = () => toast('读取文件失败');
  rd.onload = () => {
    let d;
    try { d = migrateToPX(JSON.parse(String(rd.result))); } catch (err) { return toast('导入失败：不是有效的 JSON 文件'); }
    if (!d || typeof d !== 'object' || !Array.isArray(d.elements) || !d.page || typeof d.page !== 'object')
      return toast('导入失败：缺少 page / elements 字段');
    const pages = Math.round(num(d.page.pages, 1, 1, 50));
    const els = d.elements.map(e => sanitizeElement(e, pages)).filter(Boolean);
    const seen = new Set();
    els.forEach(e => { while (seen.has(e.id)) e.id = uid(); seen.add(e.id); });
    state.page = {
      orient: pick(d.page.orient, ['portrait', 'landscape'], 'landscape'),
      margin: num(d.page.margin, 38, 0, 113),
      pages: Math.max(pages, 1 + els.reduce((m, e) => Math.max(m, e.page), -1))
    };
    state.elements = els;
    state.currentPage = Math.round(num(d.currentPage, 0, 0, state.page.pages - 1));
    state.selected = [];
    commit('import');
    renderAll(); renderPanels(); syncInspector(); fitZoom();
    toast('已导入 ' + els.length + ' 个元素');
  };
  rd.readAsText(file);
}

/* =========================================================
   11. 事件绑定 / 启动
   ========================================================= */
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('on'), 2400);
}
function updateTransforms() {
  selectedEls().forEach(el => {
    const tf = elTransform(el);
    const g = canvas.querySelector('[data-id="' + el.id + '"]');
    if (g) g.setAttribute('transform', tf);
    const s = canvas.querySelector('[data-sel="' + el.id + '"]');
    if (s) s.setAttribute('transform', tf);
  });
}

/* 左侧 tabs */
$$('#left .tabs button').forEach(b => {
  b.onclick = () => {
    $$('#left .tabs button').forEach(x => x.classList.toggle('on', x === b));
    $$('#left .panel').forEach(p => p.classList.toggle('on', p.id === 'panel-' + b.dataset.tab));
  };
});
$('#tplGrid').addEventListener('click', e => {
  const c = e.target.closest('[data-tpl]');
  if (!c) return;
  applyTemplate(c.dataset.tpl, state.selected.length === 1);
});
$('#layerList').addEventListener('click', e => {
  const eye = e.target.closest('[data-eye]');
  if (eye) {
    const el = state.elements.find(x => x.id === eye.dataset.eye);
    if (el) { el.hidden = !el.hidden; commit('hide'); renderAll(); renderPanels(); }
    return;
  }
  const it = e.target.closest('[data-el]');
  if (it) select(it.dataset.el, e.shiftKey);
});
$$('#panel-layers [data-z]').forEach(b => {
  b.onclick = () => {
    const z = b.dataset.z;
    if (z === 'dup') duplicateSel();
    else if (z === 'del') deleteSel();
    else layerOrder(z);
  };
});
$('#selOrient').onchange = e => setOrient(e.target.value);
bindStepper($('#stpMargin'), v => {
  state.page.margin = v;
  renderAll(); commit('margin');
});
$('#btnPagePrev').onclick = () => { if (state.currentPage > 0) { state.currentPage--; state.selected = []; renderAll(); renderPanels(); syncInspector(); } };
$('#btnPageNext').onclick = () => { if (state.currentPage < state.page.pages - 1) { state.currentPage++; state.selected = []; renderAll(); renderPanels(); syncInspector(); } };
$('#btnAddPage').onclick = () => {
  state.page.pages++; state.currentPage = state.page.pages - 1; state.selected = [];
  commit('addpage'); renderAll(); renderPanels(); syncInspector();
  toast('已新增第 ' + state.page.pages + ' 页');
};
$('#btnDelPage').onclick = () => {
  if (state.page.pages <= 1) return toast('至少保留 1 页');
  if (!confirm('删除第 ' + (state.currentPage + 1) + ' 页及其中的元素？')) return;
  state.elements = state.elements.filter(e => e.page !== state.currentPage);
  state.elements.forEach(e => { if (e.page > state.currentPage) e.page--; });
  state.page.pages--; state.currentPage = Math.min(state.currentPage, state.page.pages - 1);
  state.selected = [];
  commit('delpage'); renderAll(); renderPanels(); syncInspector();
};
$('#btnFit').onclick = fitZoom;
$('#zoomLabel').onclick = () => setZoom(1);
$('#btnZoomIn').onclick = () => setZoom(state.zoom + 0.1);
$('#btnZoomOut').onclick = () => setZoom(state.zoom - 0.1);
$('#btnGuides').onclick = () => { state.guides = !state.guides; renderAll(); renderPanels(); };
$('#btnUndo').onclick = undo;
$('#btnRedo').onclick = redo;
$('#btnDelSel').onclick = deleteSel;
$('#btnFillW').onclick = () => fillPage('h');
$('#btnFillH').onclick = () => fillPage('v');
$('#btnExportPng').onclick = () => exportPNG(3);
$('#btnExport').onclick = exportPDF;
$('#btnExportJson').onclick = exportJSON;
$('#btnImportJson').onclick = () => $('#fileJson').click();
$('#fileJson').onchange = e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!f) return;
  if (state.elements.length && !confirm('导入会替换当前全部内容（可撤销），继续？')) return;
  importJSON(f);
};
$('#btnResetStyle').onclick = () => {
  const sel = selectedEls();
  if (!sel.length) return;
  const tpl = TEMPLATES.find(t => t.id === state.tpl) || TEMPLATES[0];
  sel.forEach(el => { el.style = Object.assign({}, DEFAULT_STYLE, tpl.style, { text: el.style.text }); });
  commit('resetstyle'); renderAll(); syncInspector();
  toast('已重置为模板「' + tpl.name + '」的样式');
};
/* 快捷键 */
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  const inField = tag === 'input' || tag === 'textarea' || tag === 'select';
  const meta = e.ctrlKey || e.metaKey;
  if (meta && e.key.toLowerCase() === 'z') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
  if (meta && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
  if (inField) return;
  if (meta && e.key.toLowerCase() === 'd') { e.preventDefault(); duplicateSel(); return; }
  if (meta && e.key.toLowerCase() === 'a') { e.preventDefault(); state.selected = curPageEls().map(x => x.id); renderAll(); renderPanels(); syncInspector(); return; }
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteSel(); return; }
  if (e.key === 'Escape') { if (cpEl && !cpEl.hidden) { cpClose(); return; } closeCsel(); select(null); return; }
  if (e.key.indexOf('Arrow') === 0) {
    const sel = selectedEls();
    if (!sel.length) return;
    e.preventDefault();
    const step = e.shiftKey ? 5 : 1;
    const dx = e.key === 'ArrowLeft' ? -step : e.key === 'ArrowRight' ? step : 0;
    const dy = e.key === 'ArrowUp' ? -step : e.key === 'ArrowDown' ? step : 0;
    sel.forEach(el => { el.x = n2(el.x + dx); el.y = n2(el.y + dy); });
    updateTransforms(); commit('nudge'); syncInspector();
  }
});

/* =========================================================
   12. 启动
   ========================================================= */
function seedDemo() {
  state.elements = [];
  state.page.pages = 1;
  state.currentPage = 0;
  const { w: W, h: H } = pageDims();
  const tpl = TEMPLATES[0];
  const el = makeElement(Object.assign({ text: 'Hello' }, tpl.style), W / 2, H * 0.34);
  const g = getGeo(el.style);
  el.scale = n2(Math.min(1, (W - 2 * state.page.margin - 45) / g.w));
  state.elements.push(el);
  const el2 = makeElement(Object.assign({}, (TEMPLATES.find(t => t.id === 'classroom') || tpl).style, { text: 'Welcome!' }), W / 2, H * 0.62);
  const g2 = getGeo(el2.style);
  el2.scale = n2(Math.min(1, (W - 2 * state.page.margin - 45) / g2.w));
  state.elements.push(el2);
  state.selected = [];
}
function boot() {
  let loaded = false;
  try {
    const raw = localStorage.getItem(LSKEY);
    if (raw) {
      const d = migrateToPX(JSON.parse(raw));
      if (d && d.elements && d.page) {
        state.page = Object.assign({ orient: 'landscape', margin: 38, pages: 1 }, d.page);
        state.elements = d.elements;
        state.elements.forEach(e => pruneStyle(e.style));
        state.currentPage = d.currentPage || 0;
        if (state.currentPage >= state.page.pages) state.currentPage = 0;
        loaded = true;
      }
    }
  } catch (err) { console.warn('读取本地数据失败', err); }
  if (!loaded) seedDemo();
  renderAll(); renderPanels(); syncInspector();
  setTimeout(renderTemplates, 30);   /* 缩略图较慢，先让画布出图 */
  enhanceSelect($('#selOrient'), true);
  hist.undo = [snapshot()];
  updateUndoBtns();
  fitZoom();
  /* 内嵌手写体是异步加载的：到位后清掉几何缓存重绘，避免先用回退字体描边 */
  if (document.fonts && document.fonts.load) {
    Promise.all([document.fonts.load('400 100px CLHand'), document.fonts.load('900 100px CLHand')])
      .then(() => { GEOCACHE.clear(); renderAll(); setTimeout(renderTemplates, 0); })
      .catch(() => {});
  }
}
boot();
